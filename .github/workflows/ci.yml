name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Validate Prisma schemas
        run: |
          npx prisma validate --schema apps/backend/prisma/schema.prisma
          npx prisma validate --schema apps/backend/prisma-postgres/schema.prisma

      - name: Backend build
        run: npm run build:backend

      - name: Backend tests
        run: npm run test:backend

      - name: Web build
        run: npm run build:web

      - name: Mobile typecheck
        run: npm run typecheck:mobile

      - name: Docker compose config
        run: docker compose -f docker-compose.postgres-local.yml config
