services:
  postgres:
    image: postgres:16-alpine
    container_name: fuvex_postgres_local
    environment:
      POSTGRES_DB: fuvex
      POSTGRES_USER: fuvex
      POSTGRES_PASSWORD: fuvex_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_local_data:
